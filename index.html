<script>
(function(){
var NS="http://www.w3.org/2000/svg",MAXLV=100000,DT=150;
var DIRS=[[-1,0],[0,1],[1,0],[0,-1]];
var COLORS=["#ef4f5a","#f59e2c","#2fb174","#3f78f5","#9a5bd6","#e0479e","#12aeb0","#6b7a8f"];
var S={level:1,best:1,cleared:0,hints:5,wins:0,theme:"auto",sound:true,vib:true,day:null,dwins:0};
try{var raw=localStorage.getItem("arrows_v3");if(raw)Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("arrows_v3",JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var playing=1,mode="lv",hearts=3,maxH=3,arrows=[],map={},NC=5,NR=5,active=0,over=false,gid=0,startCnt=0,tmr=null,deadline=0;
function fmt(n){return n.toLocaleString("en-US")}
function applyTheme(){var r=document.documentElement;if(S.theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",S.theme)}
applyTheme();
/* date + missions */
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function ensureDay(){if(!S.day||S.day.date!==today()){S.day={date:today(),lv:0,fl:0,dc:false,claimed:{}};save();return true}return false}
var MIS=[{id:"lv",t:"Clear 5 levels",n:5,r:2,g:function(){return S.day.lv}},{id:"fl",t:"Clear 2 levels without a mistake",n:2,r:3,g:function(){return S.day.fl}},{id:"dc",t:"Beat the Daily Challenge",n:1,r:10,g:function(){return S.day.dc?1:0}}];
function checkMissions(){ensureDay();MIS.forEach(function(m){if(m.g()>=m.n&&!S.day.claimed[m.id]){S.day.claimed[m.id]=1;S.hints+=m.r;toast("Mission complete: +"+m.r+" hints")}});save()}
function msLeft(){var n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1);return m-n}
function hms(ms){var s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return("0"+h).slice(-2)+":"+("0"+m).slice(-2)+":"+("0"+s%60).slice(-2)}
function homeRender(){
ensureDay();
$("plv").textContent="Level "+fmt(S.level);
$("dsub").textContent=S.day.dc?"Completed. Replay for fun (no reward)":"Very hard \u00b7 full board \u00b7 2 hearts \u00b7 "+DT+"s \u00b7 +10 hints";
var h="";MIS.forEach(function(m){var v=Math.min(m.g(),m.n),ok=m.g()>=m.n;h+='<div class="mr'+(ok?" ok":"")+'"><div class="t"><span>'+m.t+'</span><em>'+(ok?"\u2714 +"+m.r:v+"/"+m.n+" \u00b7 +"+m.r)+'</em></div><div class="pb"><i style="width:'+(v/m.n*100)+'%"></i></div></div>'});
$("ml").innerHTML=h;$("rst").textContent="Resets in "+hms(msLeft())}
setInterval(function(){if($("home").classList.contains("on")){if(ensureDay())homeRender();else $("rst").textContent="Resets in "+hms(msLeft())}},1000);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&$("home").classList.contains("on"))homeRender()});
/* sound + vibration */
var AC=null;
function beep(f,d,type,v,delay){if(!S.sound)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(v||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function vib(ms){if(S.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("show")},2200)}
function confetti(){for(var i=0;i<36;i++){var d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=COLORS[i%COLORS.length];d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(function(x){x.remove()},2600,d)}}
function stopT(){clearInterval(tmr);tmr=null}
function go(id){document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("on")});$(id).classList.add("on");if(id==="home")homeRender()}
function sheet(html,bind,closable){var s=$("sheet");s.innerHTML=html;$("ov").classList.add("show");$("ov").dataset.c=closable===false?"0":"1";if(bind)bind(s)}
function closeSheet(){$("ov").classList.remove("show")}
$("ov").addEventListener("pointerdown",function(e){if(e.target===$("ov")&&$("ov").dataset.c==="1")closeSheet()});
/* generation */
function params(L){return{size:Math.min(10,6+Math.floor(Math.pow(L,.4)/1.5)),maxLen:Math.min(14,3+Math.floor(Math.pow(L,.33))),minLen:Math.min(6,2+Math.floor(Math.pow(L,.22))),cnt:10+Math.floor(Math.pow(L,.6)*2.5)}}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function key(r,c){return r+","+c}
function inb(r,c){return r>=0&&c>=0&&r<NR&&c<NC}
function head(a){return a.cells[a.cells.length-1]}
function dir(a){return DIRS[a.d]}
function rayCells(r,c,d){var o=[];for(;;){r+=d[0];c+=d[1];if(!inb(r,c))return o;o.push([r,c])}}
function isFree(a){var h=head(a),rc=rayCells(h[0],h[1],dir(a));for(var i=0;i<rc.length;i++)if(map[key(rc[i][0],rc[i][1])])return false;return true}
function gen(seed,P){
var R=rng(seed);NC=P.size;NR=P.rows;arrows=[];map={};
var cells=[];for(var r=0;r<NR;r++)for(var c=0;c<NC;c++)cells.push([r,c]);
for(var i=cells.length-1;i>0;i--){var j=Math.floor(R()*(i+1));var t=cells[i];cells[i]=cells[j];cells[j]=t}
for(var k=0;k<cells.length&&arrows.length<P.cnt;k++){
var h=cells[k];if(map[key(h[0],h[1])])continue;
var ds=[0,1,2,3].sort(function(){return R()-.5});
for(var q=0;q<4;q++){
var d=DIRS[ds[q]],rc=rayCells(h[0],h[1],d),ok=true,rs={};
for(var m=0;m<rc.length;m++){var kk=key(rc[m][0],rc[m][1]);if(map[kk]){ok=false;break}rs[kk]=1}
if(!ok)continue;
var br=h[0]-d[0],bc=h[1]-d[1];
if(!inb(br,bc)||map[key(br,bc)])continue;
var path=[h,[br,bc]],used={};used[key(h[0],h[1])]=1;used[key(br,bc)]=1;
var target=P.minLen+Math.floor(R()*(P.maxLen-P.minLen+1));
while(path.length<target){
var cur=path[path.length-1],opts=[];
for(var e=0;e<4;e++){var nr=cur[0]+DIRS[e][0],nc=cur[1]+DIRS[e][1],nk=key(nr,nc);
if(inb(nr,nc)&&!map[nk]&&!used[nk]&&!rs[nk])opts.push([nr,nc])}
if(!opts.length)break;

var a_svg=null;

function clearHints(){arrows.forEach(function(a){a.g&&a.g.classList.remove("hint")})}

function slide(a){

a.cells.forEach(function(p){delete map[key(p[0],p[1])]});

var P=centers(a),n=P.length,d=dir(a),H=head(a),k0=rayCells(H[0],H[1],d).length+1,K=k0+n+2,last=P[n-1];

requestAnimationFrame(step)}
function win(){
beep(660,.15,"sine",.08);beep(880,.15,"sine",.08,.12);beep(1100,.25,"sine",.08,.24);vib([30,40,30]);confetti();
S.cleared+=startCnt;ensureDay();
if(mode==="dc"){
var firstD=!S.day.dc;S.day.dc=true;if(firstD)S.dwins++;checkMissions();save();

var first=playing===S.level;
S.day.lv++;if(hearts===maxH)S.day.fl++;
if(first){S.wins++;if(S.level<MAXLV)S.level++;S.best=Math.max(S.best,S.level);if(S.wins%3===0){S.hints++}}

$("sH").onclick=function(){closeSheet();go("home")};
$("sN").onclick=function(){closeSheet();if(done)go("home");else start(Math.min(playing+1,MAXLV),"lv")}},false)}
